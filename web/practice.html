<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>练习区 · Excel 公式经验库</title>
  <style>
    :root {
      --ink: #202124;
      --muted: #61646b;
      --line: #d9dde5;
      --page: #f7f8fb;
      --panel: #ffffff;
      --soft: #f1f4f9;
      --blue: #2563eb;
      --blue-soft: #e8efff;
      --green: #16845b;
      --green-soft: #e3f4ec;
      --amber: #b45309;
      --amber-soft: #fff4dc;
      --mark: #fff3bf;
      --mark-line: #e2c044;
      --red: #b42318;
      --red-soft: #fdecea;
      --violet: #6d28d9;
      --shadow: 0 10px 28px rgba(28, 35, 52, .08);
      --mono: "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; background: var(--page); color: var(--ink); font-family: "Microsoft YaHei", "PingFang SC", system-ui, -apple-system, "Segoe UI", sans-serif; line-height: 1.65; }
    a { color: var(--blue); text-decoration: none; }
    code { font-family: var(--mono); font-size: .9em; background: var(--soft); border: 1px solid var(--line); border-radius: 4px; padding: .05em .35em; white-space: pre-wrap; word-break: break-word; }
    h1, h2, h3 { margin: 0; line-height: 1.3; letter-spacing: 0; }
    p { margin: 0; }
    .muted { color: var(--muted); }
    .small { font-size: 12px; }
    :focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

    .app { min-height: 100vh; display: grid; grid-template-columns: 260px minmax(0, 1fr); }
    .sidebar { position: sticky; top: 0; height: 100vh; padding: 24px 18px; background: #111827; color: #f8fafc; overflow-y: auto; display: flex; flex-direction: column; gap: 18px; }
    .brand { display: grid; gap: 6px; padding-bottom: 18px; border-bottom: 1px solid rgba(255,255,255,.16); }
    .brand strong { font-size: 22px; line-height: 1.2; }
    .brand span { color: #cbd5e1; font-size: 13px; }
    #nav { display: grid; gap: 6px; }
    #nav a { display: flex; justify-content: space-between; gap: 8px; padding: 10px 12px; border-radius: 8px; color: #dbeafe; font-size: 14px; }
    #nav a:hover { background: rgba(255,255,255,.12); color: #fff; }
    #nav a.on { background: rgba(255,255,255,.16); color: #fff; font-weight: 700; }
    #nav a span { color: #93c5fd; font-size: 12px; font-weight: 400; }
    .back { margin-top: auto; color: #93c5fd; font-size: 14px; padding: 10px 12px; border: 1px solid rgba(255,255,255,.16); border-radius: 8px; }
    .back:hover { background: rgba(255,255,255,.08); }

    main { min-width: 0; padding: 32px; display: flex; flex-direction: column; gap: 20px; }
    main > * { width: 100%; max-width: 1040px; }
    .hero, .page-h { display: grid; gap: 12px; padding: 26px 28px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); }
    .hero h1, .page-h h1 { font-size: clamp(26px, 3.4vw, 36px); }
    .eyebrow { color: var(--blue); font-weight: 700; font-size: 14px; }
    .lede { color: var(--muted); max-width: 820px; }
    .sec-h { font-size: 18px; margin-top: 8px; }
    .note { background: var(--amber-soft); color: #6b3d00; padding: 10px 14px; border-radius: 8px; font-size: 14px; }
    .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 20px; display: grid; gap: 10px; }
    .empty { color: var(--muted); text-align: center; padding: 28px; border: 1px dashed var(--line); border-radius: 8px; background: var(--panel); }

    .btn { border: 1px solid var(--line); background: #fff; color: var(--ink); border-radius: 8px; padding: 8px 13px; font: inherit; font-size: 14px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; line-height: 1.3; }
    .btn:hover { border-color: var(--blue); }
    .btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
    .btn.primary:hover { background: #1d4ed8; }
    .btn.small { font-size: 13px; padding: 5px 10px; }
    .btn.quiet { border-color: transparent; background: transparent; color: var(--muted); }
    .btn.danger { color: var(--red); border-color: #f1b8b2; }
    .btn:disabled { opacity: .55; cursor: default; }
    .link { background: none; border: 0; padding: 0; color: var(--blue); cursor: pointer; font: inherit; text-decoration: underline; }
    .chip { font: inherit; font-size: 13px; padding: 4px 12px; border-radius: 999px; border: 1px solid var(--line); background: #fff; color: var(--ink); cursor: pointer; }
    .chip.on { background: #111827; border-color: #111827; color: #fff; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .pill { display: inline-block; font-size: 12px; padding: 1px 9px; border-radius: 999px; white-space: nowrap; }
    .st-new { background: var(--soft); color: var(--muted); }
    .st-peek, .st-redo { background: var(--amber-soft); color: var(--amber); }
    .st-due { background: var(--blue-soft); color: var(--blue); }
    .st-done { background: var(--green-soft); color: var(--green); }
    .kind { font-size: 12px; font-weight: 700; padding: 1px 8px; border-radius: 4px; white-space: nowrap; }
    .kind-grid { background: var(--blue-soft); color: var(--blue); }
    .kind-recall { background: #f1eafe; color: var(--violet); }
    .kind-cloze { background: var(--green-soft); color: var(--green); }
    .area { font-size: 12px; color: var(--muted); white-space: nowrap; }
    .more { font-size: 14px; }

    .cards { display: grid; gap: 18px; }
    .ex { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 20px; display: grid; gap: 12px; box-shadow: var(--shadow); min-width: 0; }
    .ex.chal { border-style: dashed; }
    .ex-h { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 10px; }
    .ex-h h3 { flex: 1 1 220px; font-size: 17px; }
    .ask { font-size: 15px; }
    .story { font-size: 13px; }
    .where { font-size: 13px; }

    .grid-box { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #fff; }
    .tabs { display: flex; flex-wrap: wrap; gap: 0; background: var(--soft); border-bottom: 1px solid var(--line); }
    .tab { font: inherit; font-size: 12.5px; padding: 6px 14px; border: 0; border-right: 1px solid var(--line); background: transparent; color: var(--muted); cursor: pointer; }
    .tab.on { background: #fff; color: var(--ink); font-weight: 700; box-shadow: inset 0 2px 0 var(--green); }
    .tbl-wrap { overflow-x: auto; max-width: 100%; }
    .grid { border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; min-width: 100%; }
    .grid th, .grid td { border: 1px solid #e3e7ee; padding: 3px 8px; height: 26px; white-space: nowrap; }
    .grid thead th, .grid .rowh { background: var(--soft); color: var(--muted); font-weight: 400; font-family: var(--mono); font-size: 11px; text-align: center; }
    .grid .rowh, .grid .corner { width: 34px; }
    .grid td { min-width: 70px; cursor: default; }
    .grid td.num { text-align: right; font-family: var(--mono); font-size: 12.5px; }
    .grid td.hd { font-weight: 700; background: #fafbfd; }
    .grid td.tgt { background: var(--mark); cursor: pointer; }
    .grid td.tgt.spill { background: #fff9dd; }
    .grid td.ok { background: var(--green-soft); color: var(--green); }
    .grid td.bad { background: var(--red-soft); color: var(--red); }
    .grid td.ok::after { content: " ✓"; font-size: 11px; }
    .grid td.bad::after { content: " ✗"; font-size: 11px; }
    .grid td.err { font-family: var(--mono); font-weight: 700; }
    .grid-info { font-size: 13px; padding: 8px 12px; border-top: 1px solid var(--line); background: #fafbfd; color: var(--muted); min-height: 38px; word-break: break-word; }
    .grid-info strong { color: var(--ink); font-family: var(--mono); }
    .grid-info .ok { color: var(--green); font-weight: 700; } .grid-info .bad { color: var(--red); font-weight: 700; }

    .fbar { display: flex; align-items: stretch; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #fff; }
    .fbar:focus-within { border-color: var(--blue); }
    .fx { display: flex; align-items: center; gap: 8px; padding: 0 10px; background: var(--soft); border-right: 1px solid var(--line); color: var(--muted); font-family: var(--mono); font-size: 12px; flex: none; }
    .fx i { font-family: Georgia, serif; font-size: 14px; }
    .cellname { color: var(--ink); font-weight: 700; }
    .fin { flex: 1 1 auto; min-width: 0; border: 0; padding: 10px 12px; font-family: var(--mono); font-size: 14px; color: var(--ink); background: transparent; }
    .fin:focus { outline: none; }
    .fin.solo { flex: 0 1 220px; border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; }
    .fbar .btn { border: 0; border-radius: 0; }
    .rin { width: 100%; font-family: var(--mono); font-size: 14px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; resize: vertical; }
    .msg { border-radius: 8px; padding: 10px 14px; font-size: 14px; display: grid; gap: 6px; justify-items: start; }
    .msg ul { margin: 0; padding-left: 18px; }
    .msg.ok { background: var(--green-soft); } .msg.ok strong { color: var(--green); }
    .msg.bad { background: var(--red-soft); } .msg.bad strong { color: var(--red); }
    .msg.warn { background: var(--amber-soft); } .msg.warn strong { color: var(--amber); }
    .msg.wide { width: 100%; max-width: 1040px; }
    .tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .confirm { background: var(--amber-soft); border-radius: 8px; padding: 12px 14px; display: grid; gap: 8px; font-size: 14px; }
    .hints { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
    .hints:empty { display: none; }
    .hints li { display: flex; gap: 10px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; background: #fafbfd; font-size: 14px; }
    .hint-n { color: var(--blue); font-weight: 700; font-size: 12px; white-space: nowrap; padding-top: 1px; }
    .ans { border-top: 1px dashed var(--line); padding-top: 12px; display: grid; gap: 10px; justify-items: start; }
    .ans-f { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .lbl { font-size: 12px; font-weight: 700; color: var(--muted); }
    .steps { border-collapse: collapse; width: 100%; font-size: 14px; }
    .steps th, .steps td { text-align: left; vertical-align: top; padding: 7px 10px 7px 0; border-bottom: 1px solid var(--line); }
    .steps th { font-weight: 400; width: 42%; }
    .alts { display: grid; gap: 6px; font-size: 14px; }
    .alts p { display: grid; gap: 2px; }
    pre.cloze { margin: 0; padding: 14px 16px; background: #0f172a; color: #e2e8f0; border-radius: 8px; font-family: var(--mono); font-size: 13px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; overflow-x: auto; }
    pre.cloze mark { background: #facc15; color: #111827; border-radius: 3px; padding: 0 2px; }

    .filters { display: grid; gap: 10px; }
    .search { font: inherit; font-size: 14px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; max-width: 360px; background: #fff; }
    .list { display: grid; gap: 8px; }
    .row-i { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto auto; gap: 12px; align-items: center; padding: 12px 16px; background: #fff; border: 1px solid var(--line); border-radius: 8px; color: var(--ink); }
    .row-i:hover { border-color: var(--blue); }
    .row-t { display: grid; min-width: 0; }
    .row-t strong { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .row-t .muted { font-size: 12.5px; }
    .cov { border-collapse: collapse; width: 100%; font-size: 14px; }
    .cov th, .cov td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; }
    .cov th { font-size: 12px; color: var(--muted); }
    .cov td.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
    .file { position: absolute; width: 1px; height: 1px; opacity: 0; }

    @media (max-width: 860px) {
      .app { display: block; }
      .sidebar { position: static; height: auto; padding: 16px; gap: 12px; }
      .brand { padding-bottom: 10px; }
      #nav { display: flex; flex-wrap: wrap; gap: 6px; }
      #nav a { padding: 6px 10px; border: 1px solid rgba(255,255,255,.16); }
      .back { margin-top: 0; }
      main { padding: 16px; }
      .hero, .page-h { padding: 18px; }
      .ex { padding: 16px; }
      .row-i { grid-template-columns: 56px minmax(0, 1fr); }
      .row-i > :nth-child(3), .row-i > :nth-child(4) { grid-column: 2; justify-self: start; }
    }
    @media (max-width: 520px) {
      .fbar { flex-wrap: wrap; }
      .fbar .btn { width: 100%; justify-content: center; border-top: 1px solid var(--line); }
      .steps th { width: auto; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <strong>练习区</strong>
        <span>经验库里出现过的公式，工作日每天一组</span>
      </div>
      <nav id="nav" aria-label="练习区目录">
        <a href="#today" data-v="today">今日练习 <span id="nav-today-n"></span></a>
        <a href="#bank" data-v="bank">题库</a>
        <a href="#coverage" data-v="coverage">函数覆盖</a>
        <a href="#review" data-v="review">复习本 <span id="nav-review-n"></span></a>
        <a href="#backup" data-v="backup">备份进度</a>
      </nav>
      <a class="back" href="index.html">← 返回经验库</a>
    </aside>
    <main id="main"></main>
  </div>
  <script src="practice/engine.js"></script>
  <script src="practice/bank.js"></script>
  <script src="practice/core.js"></script>
  <script src="practice/app.js"></script>
</body>
</html>
